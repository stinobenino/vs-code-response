<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uitleg - Code-Helper Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background-color: #252538; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); max-width: 750px; width: 100%; border: 1px solid #313244; }
        .terminal-box { padding: 25px; background-color: #11111b; border-left: 4px solid #a6e3a1; border-radius: 6px; font-family: 'Courier New', Courier, monospace; margin-bottom: 30px; }
        .terminal-box strong { color: #a6e3a1; display: block; margin-bottom: 12px; font-size: 16px; }
        .terminal-box p { margin: 0; color: #cdd6f4; line-height: 1.6; font-size: 16px; white-space: pre-wrap; }
        .terug-knop { display: inline-block; padding: 12px 24px; background-color: #313244; color: #cdd6f4; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; }
        .terug-knop:hover { background-color: #45475a; }
    </style>
</head>
<body>

<div class="container">
    <div id="resultaat" class="terminal-box">
        <strong id="resultaat-titel">[Laden...]</strong>
        <p id="resultaat-tekst">De uitleg wordt live opgehaald uit de cloud...</p>
    </div>
    <a href="index.html" class="terug-knop">&larr; Volgende vraag stellen</a>
</div>

<script>
    // De juiste basis-URL en API key gekoppeld aan jouw Supabase project
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_clZiwizfLZgAYIHSOyd0wA_EtOG66uB";

    const urlParams = new URLSearchParams(window.location.search);
    const opdrachtInput = urlParams.get('opdracht')?.toLowerCase().trim();
    const stapInput = urlParams.get('stap');

    const resultaatBox = document.getElementById("resultaat");
    const resultaatTitel = document.getElementById("resultaat-titel");
    const resultaatTekst = document.getElementById("resultaat-tekst");

    async function haalUitlegOp() {
        try {
            // Vraag de specifieke opdracht op aan de database
            const response = await fetch(`${SUPABASE_URL}/rest/v1/opdrachten?naam=eq.${encodeURIComponent(opdrachtInput)}`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();

            // HERSTELD: Controleer of er daadwerkelijk een opdracht is gevonden in de lijst (data.length > 0)
            if (data && data.length > 0) {
                const item = data[0]; // Pak specifiek de eerste rij uit de database
                const uitlegVeld = item[`s${stapInput}_uitleg`];
                const titelVeld = item[`s${stapInput}_titel`];

                resultaatTitel.innerText = `[INFO] Hulp voor ${opdrachtInput.toUpperCase()} > ${titelVeld}:`;
                resultaatTekst.innerText = uitlegVeld || "Geen specifieke uitleg ingevoerd voor deze stap.";
                resultaatBox.style.borderLeftColor = "#a6e3a1"; // Groene balk voor succes
            } else {
                resultaatTitel.innerText = "[ERROR] Opdracht niet gevonden";
                resultaatTekst.innerText = `De opdracht '${opdrachtInput}' staat helaas niet in de online database. Controleer of je de naam exact zo hebt gespeld als bij het invoeren.`;
                resultaatBox.style.borderLeftColor = "#f38ba8"; // Rode balk voor foutmelding
            }
        } catch (error) {
            resultaatTitel.innerText = "[ERROR] Databasefout";
            resultaatTekst.innerText = "Er kon geen stabiele verbinding worden gemaakt met de Supabase-cloud.";
            resultaatBox.style.borderLeftColor = "#f38ba8"; 
            console.error(error);
        }
    }

    if (opdrachtInput && stapInput) {
        haalUitlegOp();
    } else {
        resultaatTitel.innerText = "[ERROR] Ongeldige parameters";
        resultaatTekst.innerText = "Er is geen opdracht of stap meegestuurd vanuit de startpagina.";
        resultaatBox.style.borderLeftColor = "#f38ba8";
    }
</script>
</body>
</html>
